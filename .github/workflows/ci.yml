name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # rustfmt.toml at the root covers both workspaces (#87). The Tauri shell is
      # its own workspace; fmt only reads metadata, so no webkit is needed.
      - name: Rust formatting
        run: |
          cargo fmt --all --check
          cargo fmt --check --manifest-path app/src-tauri/Cargo.toml

      # ink-core + ink-cli. The workspace excludes app/src-tauri, so no webkit
      # is needed here.
      - name: Rust tests
        run: cargo test --workspace

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # Catches JS/import breakage in the frontend, plus every runnable
      # src/*.test.mjs self-check. Does not build the Tauri app (needs system
      # webkit libs).
      - name: Frontend build + self-checks
        working-directory: app
        run: |
          npm ci
          npm run build
          for t in src/*.test.mjs; do echo "$t"; node "$t"; done
