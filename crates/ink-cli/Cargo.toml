[package]
name = "ink-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "CLI for rendering inkpot documents to manuscript, outline, or edit views."

[[bin]]
name = "ink"
path = "src/main.rs"

[dependencies]
# The CLI enables Shunn PDF export (#23); the core crate keeps it default-off.
ink-core = { path = "../ink-core", features = ["pdf"] }
