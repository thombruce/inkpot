[package]
name = "inkpot-app"
version = "0.1.0"
edition = "2021"
description = "inkpot desktop shell (Tauri v2)."

[lib]
name = "inkpot_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
ink-core = { path = "../../crates/ink-core" }
