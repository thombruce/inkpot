<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>inkpot</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <header class="toolbar">
      <button id="toggleOutline" class="active" title="Toggle outline">Outline</button>
      <button id="new">New</button>
      <button id="open">Open</button>
      <select id="recent" class="recent" title="Recent files"></select>
      <button id="save">Save</button>
      <button id="saveAs">Save As</button>
      <button id="export" title="Export the rendered manuscript">Export</button>
      <span id="filename" class="filename">untitled</span>
      <span id="wordcount" class="wordcount"></span>
      <button id="toggleCodex" title="Codex — characters, locations, notes">Codex</button>
      <button id="toggleCharacters" title="Characters — your cast at a glance">Characters</button>
      <button id="toggleMap" title="Map — locations by their coordinates">Map</button>
      <button id="toggleTimeline" title="Timeline — scenes in story-time order">Timeline</button>
      <button id="togglePreview">Preview</button>
    </header>
    <main class="panes">
      <aside id="outline" class="pane outline" aria-label="Outline"></aside>
      <section class="pane editor">
        <div id="editor" aria-label="Source"></div>
      </section>
      <section class="pane preview">
        <div id="preview" class="reading" aria-live="polite"></div>
      </section>
      <section class="pane codex">
        <div id="codex" class="reading" aria-live="polite"></div>
      </section>
      <section class="pane timeline">
        <div id="timeline" class="reading" aria-live="polite"></div>
      </section>
      <section class="pane characters">
        <div class="characters-bar">
          <button id="newCharacter">+ New character</button>
        </div>
        <div id="characters" class="reading" aria-live="polite"></div>
      </section>
      <section class="pane map">
        <div id="map"></div>
      </section>
    </main>
    <script type="module" src="./main.js"></script>
  </body>
</html>
