<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>inkpot</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <header class="toolbar">
      <button id="new">New</button>
      <button id="open">Open</button>
      <button id="save">Save</button>
      <button id="saveAs">Save As</button>
      <span id="filename" class="filename">untitled</span>
    </header>
    <main class="panes">
      <aside id="outline" class="pane outline" aria-label="Outline"></aside>
      <section class="pane editor">
        <div id="editor" aria-label="Source"></div>
      </section>
      <section class="pane preview">
        <div class="viewbar" role="tablist">
          <button data-view="manuscript" class="active">Manuscript</button>
          <button data-view="edit">Edit</button>
        </div>
        <pre id="preview" aria-live="polite"></pre>
      </section>
    </main>
    <script type="module" src="./main.js"></script>
  </body>
</html>
